<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポモドーロ タイマー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .app {
    text-align: center;
    padding: 40px;
  }

  h1 {
    font-size: 1.4rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #a0aec0;
    margin-bottom: 32px;
  }

  /* Mode tabs */
  .modes {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 40px;
  }

  .mode-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    color: #a0aec0;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }

  .mode-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* SVG ring timer */
  .timer-ring {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto 40px;
  }

  .timer-ring svg {
    transform: rotate(-90deg);
  }

  .ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.07);
    stroke-width: 10;
  }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.4s;
  }

  .timer-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .time-display {
    font-size: 3.6rem;
    font-weight: 200;
    letter-spacing: 2px;
    line-height: 1;
  }

  .phase-label {
    font-size: 0.8rem;
    letter-spacing: 3px;
    color: var(--accent);
    margin-top: 8px;
    text-transform: uppercase;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 40px;
  }

  .btn {
    padding: 14px 36px;
    border: none;
    border-radius: 30px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .btn-primary:hover {
    filter: brightness(1.15);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: #a0aec0;
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.14);
  }

  /* Session dots */
  .sessions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: background 0.3s;
  }

  .dot.done {
    background: var(--accent);
  }

  .dot.current {
    background: var(--accent);
    opacity: 0.5;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.3); opacity: 1; }
  }

  .session-count {
    font-size: 0.8rem;
    color: #718096;
    letter-spacing: 1px;
  }

  /* Notification banner */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #2d3748;
    color: #eee;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 0.9rem;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    border-left: 4px solid var(--accent);
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* Theme vars per mode */
  body.focus { --accent: #e05252; }
  body.short  { --accent: #48bb78; }
  body.long   { --accent: #4299e1; }
</style>
</head>
<body class="focus">

<div class="app">
  <h1>🍅 Pomodoro</h1>

  <div class="modes">
    <button class="mode-btn active" data-mode="focus" data-minutes="25">作業 25分</button>
    <button class="mode-btn" data-mode="short" data-minutes="5">休憩 5分</button>
    <button class="mode-btn" data-mode="long" data-minutes="15">長休憩 15分</button>
  </div>

  <div class="timer-ring">
    <svg width="260" height="260" viewBox="0 0 260 260">
      <circle class="ring-bg" cx="130" cy="130" r="115"/>
      <circle class="ring-progress" id="ring" cx="130" cy="130" r="115"/>
    </svg>
    <div class="timer-label">
      <div class="time-display" id="display">25:00</div>
      <div class="phase-label" id="phaseLabel">集中タイム</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="startBtn">スタート</button>
    <button class="btn btn-secondary" id="resetBtn">リセット</button>
  </div>

  <div class="sessions" id="sessionDots"></div>
  <div class="session-count" id="sessionCount">今日: 0 セッション完了</div>
</div>

<div class="toast" id="toast"></div>

<script>
const CIRCUMFERENCE = 2 * Math.PI * 115;
const ring = document.getElementById('ring');
ring.style.strokeDasharray = CIRCUMFERENCE;

const modes = {
  focus: { label: '集中タイム', minutes: 25 },
  short: { label: '短い休憩',   minutes: 5  },
  long:  { label: '長い休憩',   minutes: 15 },
};

let currentMode = 'focus';
let totalSeconds = 25 * 60;
let secondsLeft  = totalSeconds;
let running = false;
let timer = null;
let completedSessions = 0;
let sessionInSet = 0; // 0-3 within a 4-pomodoro cycle

const display   = document.getElementById('display');
const phaseLabel= document.getElementById('phaseLabel');
const startBtn  = document.getElementById('startBtn');
const resetBtn  = document.getElementById('resetBtn');
const dotsEl    = document.getElementById('sessionDots');
const countEl   = document.getElementById('sessionCount');
const toast     = document.getElementById('toast');

function updateDisplay() {
  const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
  const s = (secondsLeft % 60).toString().padStart(2, '0');
  display.textContent = `${m}:${s}`;
  document.title = running ? `${m}:${s} – ポモドーロ` : 'ポモドーロ タイマー';

  const progress = secondsLeft / totalSeconds;
  ring.style.strokeDashoffset = CIRCUMFERENCE * progress;
}

function renderDots() {
  dotsEl.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < sessionInSet ? ' done' : i === sessionInSet && running && currentMode === 'focus' ? ' current' : '');
    dotsEl.appendChild(d);
  }
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function playBeep(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const count = type === 'done' ? 3 : 1;
    for (let i = 0; i < count; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = type === 'done' ? 880 : 660;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.3 + 0.3);
      osc.start(ctx.currentTime + i * 0.3);
      osc.stop(ctx.currentTime + i * 0.3 + 0.3);
    }
  } catch(e) {}
}

function onComplete() {
  running = false;
  startBtn.textContent = 'スタート';
  playBeep('done');

  if (currentMode === 'focus') {
    completedSessions++;
    sessionInSet = (sessionInSet + 1) % 4;
    countEl.textContent = `今日: ${completedSessions} セッション完了`;

    if (sessionInSet === 0) {
      showToast('🎉 4セッション達成！長い休憩を取りましょう');
      switchMode('long');
    } else {
      showToast('✅ セッション完了！休憩しましょう');
      switchMode('short');
    }
  } else {
    showToast('💪 さあ、集中しましょう！');
    switchMode('focus');
  }
  renderDots();
}

function tick() {
  if (secondsLeft <= 0) {
    clearInterval(timer);
    onComplete();
    return;
  }
  secondsLeft--;
  updateDisplay();
}

function switchMode(mode) {
  currentMode = mode;
  document.body.className = mode;
  totalSeconds = modes[mode].minutes * 60;
  secondsLeft  = totalSeconds;
  phaseLabel.textContent = modes[mode].label;

  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });

  updateDisplay();
}

startBtn.addEventListener('click', () => {
  if (running) {
    clearInterval(timer);
    running = false;
    startBtn.textContent = 'スタート';
  } else {
    running = true;
    startBtn.textContent = '一時停止';
    timer = setInterval(tick, 1000);
    renderDots();
  }
});

resetBtn.addEventListener('click', () => {
  clearInterval(timer);
  running = false;
  startBtn.textContent = 'スタート';
  secondsLeft = totalSeconds;
  updateDisplay();
  renderDots();
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    clearInterval(timer);
    running = false;
    startBtn.textContent = 'スタート';
    switchMode(btn.dataset.mode);
  });
});

// Init
updateDisplay();
renderDots();
</script>
</body>
</html>
